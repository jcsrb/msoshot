name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: GOOS=windows go vet ./...
      - run: ./build.sh
        env:
          VERSION: ${{ github.ref_name }}
      - name: Checksums
        run: cd bin && sha256sum *.exe > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" bin/*.exe bin/SHA256SUMS.txt --generate-notes --draft
